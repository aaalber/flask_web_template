<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Flask Template{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/normalize.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome/css/font-awesome.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {{ fontawesome_html() }}
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a href="#home" class="navbar-brand">LOGO</a>

            <button type="button" class="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav-links">
                <i class="fa fa-bars" aria-hidden="true"></i>
            </button>

            <div id="main-nav-links" class="nav__link hide">
                <a href="#about">About</a>
                <a href="#events">Events</a>
                <a href="#contact">Contact</a>
                <span class="mobile-search">
                    <input class="mobile_search_bar" type="search" placeholder="Search…" aria-label="Search">
                </span>
                <span class="search">
                    <a href="#" class="searchLink" aria-label="Toggle search"><i class="fa fa-search" aria-hidden="true"></i></a>
                    <div id="searchDiv" class="search-panel" hidden>
                        <input class="search_bar" type="search" placeholder="Search…" aria-label="Search">
                    </div>
                </span>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/nav.js') }}"></script>
</body>
</html>
